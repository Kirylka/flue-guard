name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 22 (maintenance LTS), 24 (active LTS) and 26 (current)
        node: [22, 24, 26]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  oldest-peers:
    runs-on: ubuntu-latest
    name: oldest supported peers
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The lowest versions the peer ranges allow (pi-ai matches Flue 2.0.x).
      - run: npm i --no-save @flue/runtime@2.0.8 @earendil-works/pi-ai@0.83.0 @typesafe-ai/sdk@0.6.0 valibot@1.0.0
      - run: npm test

  package:
    runs-on: ubuntu-latest
    name: package checks
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx -y publint
      - run: npm run konsistent
      - run: npx -y @arethetypeswrong/cli --pack --ignore-rules cjs-resolves-to-esm no-resolution
      - run: npm pack --dry-run
